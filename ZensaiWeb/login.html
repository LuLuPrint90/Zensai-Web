            <main class="login-main">
                <div class="container-log">
                    <form action="login.html" method="POST" class="form-login">
                        <h2>Iniciar Sesión</h2>
                        
                        <label class="login-label" for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="Ingresa tu correo electrónico">
                        
                        <label class="login-label" for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
                        
                        <label class="login-label">
                            <input type="checkbox" name="remember"> Recuérdame
                        </label>
                        
                        <button type="submit" class="submit-btn">Iniciar Sesión</button>

                        <p class="p-form">¿No tienes una cuenta? <a class="a-login" href="register.html">Registrate aquí</a></p>
                    </form>
                </div>
            </main>
