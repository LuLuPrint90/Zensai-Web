            <script>
                // Función para cargar el carrito desde localStorage y renderizarlo en la tabla
function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartItemsContainer = document.getElementById("cart-items");
    const cartTotalElement = document.getElementById("cart-total");
    const mensajeVacio = document.getElementById("mensaje-vacio");

    // Limpiar contenido anterior
    cartItemsContainer.innerHTML = "";

    if (cart.length === 0) {
        mensajeVacio.style.display = "block"; // Mostrar mensaje de carrito vacío
        cartTotalElement.textContent = "$0"; // Reiniciar total
        return;
    } else {
        mensajeVacio.style.display = "none"; // Ocultar mensaje de carrito vacío
    }

    // Inicializar el total general
    let total = 0;

    // Recorrer cada producto en el carrito y crear una fila en la tabla
    cart.forEach(product => {
        const price = parseFloat(product.price.replace(",", ""));
        const quantity = product.quantity || 1; // Asegúrate de que la cantidad no sea undefined
        const productTotal = price * quantity;

        total += productTotal;

        // Crear una nueva fila para el producto
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${product.name}</td>
            <td>$${product.price}</td>
            <td>${quantity}</td>
            <td>$${productTotal.toLocaleString()}</td>
        `;
        cartItemsContainer.appendChild(row);
    });

    // Actualizar el total general
    cartTotalElement.textContent = `$${total.toLocaleString()}`;
}

// Función para limpiar todo el carrito
document.getElementById("clear-cart").addEventListener("click", function() {
    const cartItemsContainer = document.getElementById("cart-items");
    cartItemsContainer.innerHTML = ""; // Vaciar visualmente el carrito
    localStorage.removeItem("cart"); // Eliminar los datos del carrito en localStorage
    document.getElementById("cart-total").textContent = "$0"; // Reiniciar total
    document.getElementById("mensaje-vacio").style.display = "block"; // Mostrar mensaje de carrito vacío
    alert("El carrito ha sido limpiado.");
});

// Cargar el carrito al cargar la página
document.addEventListener("DOMContentLoaded", loadCart);

            </script>
